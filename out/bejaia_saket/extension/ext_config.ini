; Generated by build.py csp; exact names from data/materials_info.json.
; Syntax: CSP wiki Tracks-–-Grass-FX.md:5–54;
; real example: config/tracks/putnam_park.ini [GRASS_FX].
[GRASS_FX]
; CSP wiki Tracks–Grass-FX:211–255: procedural dry tufts and low maquis.
TEXTURE = trees/grass.dds
TEXTURE_GRID = 4, 2
TEXTURE_GROUP_0_CHANCE = 0.14
GRASS_MATERIALS = grass, grass_mountain
OCCLUDING_MATERIALS = asphalt, asphalt_junction_0, asphalt_junction_1, asphalt_junction_2, asphalt_v1, asphalt_v2, gravel, kerb, metal, plaster, rock, sand
; Multilayer macro diffuse is neutral: do not reject it as non-green.
MASK_MAIN_THRESHOLD = -1
MASK_RED_THRESHOLD = 0
MASK_MIN_LUMINANCE = 0.02
MASK_MAX_LUMINANCE = 1
SHAPE_SIZE = 1.2
SHAPE_TIDY = 0.2
SHAPE_CUT = 0.15
SHAPE_WIDTH = 0.9

; Syntax: CSP wiki Tracks-–-Grass-FX.md:79–129,187–204;
; real example: config/tracks/ks_silverstone.ini:1338–1384.
[GRASS_FX_CONFIGURATION_A]
SHAPE_SIZE = 0.55
SHAPE_CUT = 0.45
SHAPE_TIDY = 0.15

; Same sources; our terrain txMask G is dry soil (shorter grass).
[GRASS_FX_ADJUSTMENT_0]
MATERIALS = grass, grass_mountain
USE_MULTILAYER_MASK = 1
MASK_G = A

; Syntax: CSP wiki Tracks-–-RainFX.md:3–18;
; real example: config/tracks/putnam_park.ini [RAIN_FX].
; Baked paint: brightness filtering, NOT whole-road LINES_MATERIALS.
[RAIN_FX]
PUDDLES_MATERIALS = asphalt, asphalt_junction_0, asphalt_junction_1, asphalt_junction_2, asphalt_v1, asphalt_v2
SOAKING_MATERIALS = asphalt, asphalt_junction_0, asphalt_junction_1, asphalt_junction_2, asphalt_v1, asphalt_v2, gravel, kerb, plaster
SMOOTH_MATERIALS = marker_red, metal, roadside_signs
ROUGH_MATERIALS = bark, grass, grass_mountain, gravel, rock, sand
LINES_FILTER_MATERIALS = asphalt, asphalt_junction_0, asphalt_junction_1, asphalt_junction_2, asphalt_v1, asphalt_v2

; Library: config/tracks/common/materials_track.ini:53–69,349–364;
; real example: config/tracks/monaco_2017.ini:16–23.
[INCLUDE: common/materials_track.ini]

; Same library/example; recommended textures are supplied by installed CSP.
[Material_Water]
Materials = water
Type = SEA
UseRecommendedTextures = 1

; CSP wiki Tracks–Trees:29–69: external model instances.
[TREES]
LIST_0 = trees/trees.txt

; Same GrassFX source; columns start at 1, rows at 0.
[GRASS_FX_TEXTURE_GROUP_0]
PIECE_0 = 3, 1
PIECE_0_SIZE_MULT = 0.8, 1.0
PIECE_1 = 1, 1
PIECE_1_CHANCE = 0.3
PIECE_1_SIZE_MULT = 1.4, 1.7
